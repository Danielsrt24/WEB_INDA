{% extends 'base.html' %}
{% block title %}{{ accion }} Materia - INDA{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-book"></i> {{ accion }} Materia</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Código</label>
                        <input type="text" name="codigo" class="form-control" 
                               value="{{ materia.codigo|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" 
                               value="{{ materia.nombre|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Créditos</label>
                        <input type="number" name="creditos" class="form-control" 
                               value="{{ materia.creditos|default:0 }}" min="0">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar
                        </button>
                        <a href="{% url 'materias:lista' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
