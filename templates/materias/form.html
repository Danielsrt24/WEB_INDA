{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-book"></i> 
                        {% if accion == 'Crear' %}Nueva Materia{% else %}Editar Materia{% endif %}
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-tag text-primary"></i> Nombre de la Materia
                            </label>
                            <input type="text" name="nombre" class="form-control" 
                                   value="{{ materia.nombre|default:'' }}" 
                                   placeholder="Ej: Desarrollo de Aplicaciones Móviles" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="fas fa-code text-primary"></i> Código
                            </label>
                            <input type="text" name="codigo" class="form-control" 
                                   value="{{ materia.codigo|default:'' }}" 
                                   placeholder="Ej: DAM-101" required>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                            <a href="/materias/" class="btn btn-secondary px-4">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
