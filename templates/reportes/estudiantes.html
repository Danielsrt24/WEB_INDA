{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h2><i class="fas fa-user-graduate text-warning"></i> {{ titulo }}</h2>
        <div>
            <button onclick="window.print()" class="btn btn-warning me-2 text-dark"><i class="fas fa-print"></i> Imprimir</button>
            <a href="{% url 'reportes:menu' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Sección</th>
                        <th>Nivel</th>
                        <th>Letra</th>
                        <th class="text-center">Total Alumnos</th>
                    </tr>
                </thead>
                <tbody>
                    {% for sec in secciones %}
                    <tr>
                        <td>{{ sec.nombre }}</td>
                        <td>{{ sec.nivel|default:"-" }}</td>
                        <td>{{ sec.letra|default:"-" }}</td>
                        <td class="text-center">
                            <span class="badge bg-primary">{{ sec.total_estudiantes }}</span>                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center text-muted">No hay secciones registradas.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
@media print {
    .no-print, .navbar, .sidebar { display: none !important; }
    body { background: white !important; }
    .card { border: none !important; box-shadow: none !important; }
}
</style>
{% endblock %}
