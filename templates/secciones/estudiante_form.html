{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-user-graduate"></i> 
                        {% if accion == 'Crear' %}Nuevo Estudiante{% else %}Editar Estudiante{% endif %}
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info border-0 mb-4">
                        <i class="fas fa-info-circle"></i> 
                        Sección: <strong>{{ seccion.nombre }}</strong>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-user text-primary"></i> Nombre
                                </label>
                                <input type="text" name="nombre" class="form-control" 
                                       value="{{ estudiante.nombre|default:'' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-user text-primary"></i> Apellido
                                </label>
                                <input type="text" name="apellido" class="form-control" 
                                       value="{{ estudiante.apellido|default:'' }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-id-card text-primary"></i> NIE
                                </label>
                                <input type="text" name="cedula" class="form-control" 
                                       value="{{ estudiante.cedula|default:'' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-calendar-alt text-primary"></i> Fecha de Nacimiento
                                </label>
                                <input type="date" name="fecha_nacimiento" class="form-control" 
                                       value="{{ estudiante.fecha_nacimiento|date:'Y-m-d'|default:'' }}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="fas fa-venus-mars text-primary"></i> Sexo
                            </label>
                            <select name="sexo" class="form-select" required>
                                <option value="">-- Seleccionar --</option>
                                <option value="M" {% if estudiante.sexo == 'M' %}selected{% endif %}>Masculino</option>
                                <option value="F" {% if estudiante.sexo == 'F' %}selected{% endif %}>Femenino</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                            
                            <a href="{% url 'secciones:estudiantes' seccion.pk %}" class="btn btn-secondary px-4">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
