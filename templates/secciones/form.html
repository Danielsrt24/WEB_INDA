{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-users"></i> 
                        {% if accion == 'Crear' %}Nueva Sección{% else %}Editar Sección{% endif %}
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-tag text-primary"></i> Nombre de la Sección
                            </label>
                            <input type="text" name="nombre" class="form-control" 
                                   value="{{ seccion.nombre|default:'' }}" 
                                   placeholder="Ej: Bachillerato, Primaria" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-layer-group text-primary"></i> Nivel / Año
                                </label>
                                <input type="text" name="nivel" class="form-control" 
                                       value="{{ seccion.nivel|default:'' }}" 
                                       placeholder="Ej: Primero, Segundo">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-chalkboard text-primary"></i> Letra
                                </label>
                                <input type="text" name="letra" class="form-control" 
                                       value="{{ seccion.letra|default:'' }}" 
                                       placeholder="Ej: A, B, C, Única">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                            <a href="{% url 'secciones:lista' %}" class="btn btn-secondary px-4">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
