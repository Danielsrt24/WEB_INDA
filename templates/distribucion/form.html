{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-chalkboard-teacher"></i> 
                        {% if accion == 'Crear' %}Nueva Distribución{% else %}Editar Distribución{% endif %}
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-user text-primary"></i> Profesor
                            </label>
                            <select name="id_profesor" class="form-select" required>
                                <option value="">-- Seleccionar Profesor --</option>
                                {% for prof in profesores %}
                                <option value="{{ prof.id_profesor }}" 
                                    {% if distribucion and distribucion.id_profesor_id == prof.id_profesor %}selected{% endif %}>
                                    {{ prof.nombre }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-book text-primary"></i> Materia
                            </label>
                            <select name="id_materia" class="form-select" required>
                                <option value="">-- Seleccionar Materia --</option>
                                {% for mat in materias %}
                                <option value="{{ mat.id_materia }}"
                                    {% if distribucion and distribucion.id_materia_id == mat.id_materia %}selected{% endif %}>
                                    {{ mat.nombre }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-users text-primary"></i> Sección
                            </label>
                            <select name="id_seccion" class="form-select" required>
                                <option value="">-- Seleccionar Sección --</option>
                                {% for sec in secciones %}
                                <option value="{{ sec.id_seccion }}"
                                    {% if distribucion and distribucion.id_seccion_id == sec.id_seccion %}selected{% endif %}>
                                    {{ sec.nombre }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="fas fa-clock text-primary"></i> Horas Semanales
                            </label>
                            <input type="number" name="horas_semanales" class="form-control" 
                                   value="{{ distribucion.horas_semanales|default:0 }}" min="0" required>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                            <a href="/distribucion/" class="btn btn-secondary px-4">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
